spring.application.name=lesson

# ???????? ???????????? ??? ?????? DataSource
application.recommendations-db.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# ????????? ??? H2 ???????
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ?????????????? ???????? ?????
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ????? ???? ?????? ??? ???????????? ?????? (PostgreSQL)
spring.second-datasource.url=jdbc:postgresql://localhost:5432/your_database
spring.second-datasource.username=your_username
spring.second-datasource.password=your_password
spring.second-datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

